    <title>Streak Logger | minhtrong67</title>

    <!--
      Áp dụng giao diện sáng/tối, cỡ chữ và manifest TRƯỚC khi trình duyệt vẽ lần đầu.
      Nhờ vậy khi mở PWA đã cài đặt, màn hình chờ không bị nháy nền trắng khi
      người dùng đang dùng giao diện tối.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("streak-logger:theme") || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add("booting");
          if (isDark) root.classList.add("dark");
          var size = localStorage.getItem("streak-logger:fontSize") || "md";
          root.style.fontSize = { sm: "15px", md: "16px", lg: "18px" }[size] || "16px";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#18181b" : "#7c3aed");
          var manifest = document.getElementById("app-manifest");
          if (manifest && isDark) manifest.setAttribute("href", "/manifest-dark.webmanifest");
        } catch (e) {}
      })();
    </script>

    <!-- CSS tối thiểu để nền đúng màu ngay từ khung hình đầu tiên, trước khi CSS chính tải xong. -->
    <style>
      /* Màn hình chờ: tím đậm ở giao diện sáng, đen ở giao diện tối. Không dùng nền trắng. */
      html { background: #fafafa; color-scheme: light; }
      html.dark { background: #09090b; color-scheme: dark; }
      html.booting { background: #5b21b6; }
      html.booting.dark { background: #09090b; }
      body { margin: 0; background: inherit; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #5b21b6;
      }
      html.dark #boot { background: #09090b; }
      #boot img { width: 88px; height: 88px; border-radius: 26px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .8; transform: scale(.94); } }
    </style>

    <div id="root">
      <!-- Màn hình chờ hiển thị trong lúc tải JavaScript, cùng màu nền với giao diện đang dùng. -->
      <div id="boot"><img src="/icons/icon-192.png" alt="Streak Logger" /></div>
    </div>
