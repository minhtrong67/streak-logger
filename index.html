<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6750A4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Streak Logger" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Streak Logger — dashboard cá nhân để theo dõi một mốc thời gian (streak) và ghi nhật ký streak hằng ngày."
    />
    <meta name="author" content="minhtrong67" />
    <title>Streak Logger — minhtrong67</title>
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem("streak-dashboard:theme") || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var size = localStorage.getItem("streak-dashboard:fontSize") || "md";
          var randomColor =
            localStorage.getItem("streak-dashboard:randomColor") === "true";
          var colors = [
            "material",
            "amber",
            "ocean",
            "sky",
            "forest",
            "mint",
            "rose",
            "red",
          ];
          var color = randomColor
            ? colors[Math.floor(Math.random() * colors.length)]
            : localStorage.getItem("streak-dashboard:colorTheme") || "material";
          var sizePx = { sm: "15px", md: "16px", lg: "18px" }[size] || "16px";
          var root = document.documentElement;
          if (isDark) root.classList.add("dark");
          root.classList.add("theme-" + color);
          root.style.fontSize = sizePx;
          window.__bootColorTheme = color;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
